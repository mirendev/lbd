name: Release

on:
  push:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build deb package
        run: packaging/build-deb.sh

      - name: Build rpm package
        run: packaging/build-rpm.sh

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: lbd-dkms.deb
          path: dist/*.deb

      - name: Upload rpm
        uses: actions/upload-artifact@v7
        with:
          name: lbd-dkms.rpm
          path: dist/*.rpm

  build-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-25.10
            image: ubuntu:25.10
          - name: fedora-40
            image: fedora:40
          - name: fedora-42
            image: fedora:42
    steps:
      - uses: actions/checkout@v7

      - name: Build module (${{ matrix.name }})
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.image }} \
            -f hack/test-build.Dockerfile \
            -t lbd-build .

      - name: Extract .ko
        run: |
          docker create --name extract lbd-build
          docker cp extract:/out/. out/
          docker rm extract
          echo "KVER=$(cat out/KVER)" >> "$GITHUB_ENV"

      - name: Upload .ko
        uses: actions/upload-artifact@v7
        with:
          name: lbd-${{ matrix.name }}-${{ env.KVER }}.ko
          path: out/lbd.ko*
